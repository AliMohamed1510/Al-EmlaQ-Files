<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البيانات الشخصية وجواز السفر</title>
    <style>
        /* === تنسيق رائع وجميل بداخل الملف === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* تنسيق العنوان */
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #bbbbbb;
        }

        /* تنسيق الحقول والمدخلات */
        input[type="text"], 
        input[type="date"], 
        select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2c2c2c;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: #007bff;
            background-color: #333;
        }

        /* تنسيق خاص بالحقول المتجاورة (الاسم الأول واللقب مثلاً) */
        .row {
            display: flex;
            gap: 20px;
        }

        .col {
            flex: 1;
        }

        /* زر التبديل (Dark Mode) */
        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .theme-toggle:hover {
            background: #444;
        }

        /* تنسيق القائمة المنسدلة */
        select option {
            background-color: #1e1e1e;
            color: white;
        }

        /* تحسين شكل خانة التاريخ */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        /* الوضع الفاتح (Light Mode) إذا قام المستخدم بتفعيله */
        body.light-mode {
            background-color: #f4f4f9;
            color: #222;
        }
        body.light-mode .container {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        body.light-mode label {
            color: #555;
        }
        body.light-mode input, 
        body.light-mode select {
            background-color: #f9f9f9;
            color: #222;
            border: 1px solid #ccc;
        }
        body.light-mode .theme-toggle {
            background: #ddd;
            color: #222;
        }
        body.light-mode input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0);
        }
    </style>
</head>
<body>

    <!-- زر التبديل بين الوضع الداكن والفاتح -->
    <button class="theme-toggle" onclick="toggleTheme()">🌙 تبديل الوضع</button>

    <div class="container">
        <h2>البيانات الشخصية و جواز السفر</h2>

        <!-- اختيار الدولة (تم تحديث القائمة حسب طلبك) -->
        <div class="form-group">
            <label for="country">اختر الدولة</label>
            <select id="country">
                <option value="">-- اختر الدولة --</option>
                <option value="IT">ايطاليا</option>
                <option value="ES">اسبانيا</option>
                <option value="CH">سويسرا</option>
                <option value="SE">السويد</option>
                <option value="SK">سلوفكيا</option>
                <option value="PT">البرتغال</option>
                <option value="MT">مالطا</option>
                <option value="HU">المجر-هنغاريا</option>
                <option value="GR">اليونان</option>
                <option value="HR">كروتيا</option>
                <option value="AT">النمسا</option>
            </select>
        </div>

        <!-- نوع الزيارة -->
        <div class="form-group">
            <label for="visit_type">نوع الزيارة</label>
            <select id="visit_type">
                <option value="سياحة">سياحة</option>
                <option value="عمل">عمل</option>
                <option value="علاج">علاج</option>
                <option value="دراسة">دراسة</option>
            </select>
        </div>

        <!-- الاسم الأول واللقب -->
        <div class="row">
            <div class="col form-group">
                <label for="first_name">الاسم الأول (كما في جواز السفر)</label>
                <input type="text" id="first_name" placeholder="الاسم الأول">
            </div>
            <div class="col form-group">
                <label for="last_name">اللقب (كما في جواز السفر)</label>
                <input type="text" id="last_name" placeholder="اللقب">
            </div>
        </div>

        <!-- مكان وتاريخ الميلاد -->
        <div class="row">
            <div class="col form-group">
                <label for="birth_place">مكان الميلاد</label>
                <input type="text" id="birth_place" placeholder="مكان الميلاد">
            </div>
            <div class="col form-group">
                <label for="birth_date">تاريخ الميلاد (يوم-شهر-سنة)</label>
                <input type="date" id="birth_date">
            </div>
        </div>

        <!-- الجنسية والجنس -->
        <div class="row">
            <div class="col form-group">
                <label for="nationality">الجنسية الحالية</label>
                <input type="text" id="nationality" value="مصري">
            </div>
            <div class="col form-group">
                <label for="gender">الجنس</label>
                <select id="gender">
                    <option value="ذكر">ذكر</option>
                    <option value="أنثى">أنثى</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        // دالة تبديل الوضع (التي كانت تسبب الخطأ السابق)
        function toggleTheme() {
            const body = document.body;
            const button = document.querySelector('.theme-toggle');
            
            // تبديل الكلاس
            body.classList.toggle('light-mode');
            
            // تغيير نص الزر حسب الوضع الحالي
            if (body.classList.contains('light-mode')) {
                button.innerHTML = '☀️ الوضع الفاتح';
            } else {
                button.innerHTML = '🌙 تبديل الوضع';
            }
        }
    </script>
</body>
</html>
